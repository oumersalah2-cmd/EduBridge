events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Map for SSE connection upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;
        server_name localhost;

        # Static mounts for frontend and learner packages
        location /savanna/ {
            alias /usr/share/nginx/html/savanna/;
            index index.html;
            try_files $uri $uri/ /savanna/index.html;
        }

        location /module/ {
            alias /usr/share/nginx/html/module/;
            autoindex off;
        }

        location /demo/ {
            alias /usr/share/nginx/html/demo/;
            autoindex off;
        }

        # SSE Streaming endpoints (no proxy buffering, long timeouts)
        location ~ ^/api/(v1/)?live/sessions/[^/]+/stream {
            proxy_pass http://api:4000;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host:$server_port;

            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # API & Documentation proxy
        location ~ ^/(api/|uploads/|assets/demo/|docs|openapi\.json) {
            proxy_pass http://api:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host:$server_port;
            client_max_body_size 250M;
        }

        # Default fallback
        location / {
            root /usr/share/nginx/html/savanna;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
