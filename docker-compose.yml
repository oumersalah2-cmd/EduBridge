services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      PORT: ${PORT:-4000}
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/edubridge}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:4000}
      OPENAPI_PATH: /app/openapi.yaml
      HF_HOME: /root/.cache/huggingface
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    volumes:
      - api-uploads:/app/uploads
      - whisper-cache:/root/.cache/huggingface
      - ./openapi.yaml:/app/openapi.yaml:ro

  web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:8080"
    volumes:
      - ./web/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./savanna:/usr/share/nginx/html/savanna:ro
      - ./module:/usr/share/nginx/html/module:ro
      - ./demo:/usr/share/nginx/html/demo:ro

volumes:
  mongo-data:
  api-uploads:
  whisper-cache:
