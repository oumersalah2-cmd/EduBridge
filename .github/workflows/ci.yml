name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test-api:
    name: Run API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package.json

      - name: Install API dependencies
        run: |
          cd api
          npm ci

      - name: Run API test suite
        run: |
          cd api
          npm test
