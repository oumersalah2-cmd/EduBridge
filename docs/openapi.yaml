openapi: 3.0.3
info:
  title: EduBridge API
  description: Open-source accessible learning media and live classroom platform API
  version: 1.0.0
paths:
  /api/health:
    get:
      summary: Health check endpoint
      description: Returns current API server health status
      operationId: getHealth
      responses:
        '200':
          description: API is operational
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required:
                  - status
